name: All Contributors

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  add-contributors:
    runs-on: ubuntu-latest
    # Trusted commenters only; the comment body is parsed in the script below
    if: |
      contains(github.event.comment.body, '@all-contributors') &&
      contains(github.event.comment.body, 'add @') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Parse comment
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          line=$(printf '%s\n' "$BODY" | grep -i -m1 -E '@all-contributors:?[[:space:]]+.*add[[:space:]]+@' || true)
          user=$(printf '%s' "$line" | sed -E 's/.*add[[:space:]]+@([A-Za-z0-9-]+).*/\1/I')
          types=$(printf '%s' "$line" | sed -E 's/.*add[[:space:]]+@[A-Za-z0-9-]+[[:space:]]+for[[:space:]]+//I; s/[^A-Za-z,[:space:]-]//g; s/[[:space:]]*,[[:space:]]*/,/g; s/[[:space:]]+$//')
          if [ -z "$user" ] || [ -z "$types" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "types=$types" >> "$GITHUB_OUTPUT"

      - name: Resolve branch
        if: steps.parse.outputs.ok == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ref="$DEFAULT_BRANCH"
          if [ "$IS_PR" = "true" ]; then
            read -r head_repo head_ref < <(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name + " " + .head.ref')
            # Fork branches are not pushable with GITHUB_TOKEN
            if [ "$head_repo" = "$REPO" ]; then ref="$head_ref"; fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.parse.outputs.ok == 'true'
        with:
          ref: ${{ steps.branch.outputs.ref }}

      - name: Add contributor
        if: steps.parse.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_USER: ${{ steps.parse.outputs.user }}
          CONTRIB_TYPES: ${{ steps.parse.outputs.types }}
          REF: ${{ steps.branch.outputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --yes all-contributors-cli@6 add "$CONTRIB_USER" "$CONTRIB_TYPES"
          git push origin "HEAD:$REF"
